name: Build data and publish the map

# Runs whenever something is pushed to main (e.g. an updated spreadsheet or station list),
# and can also be started by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the rebuilt data.json and exports back to the repository
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json from the master spreadsheet and station lists
        run: python scripts/build_data.py data/source/knowledge_map_master.xlsx data/data.json

      - name: Export ArcGIS-ready CSV files
        env:
          PLATFORM_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/export_arcgis.py data/data.json exports

      - name: Commit rebuilt files (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json exports
          git diff --cached --quiet || git commit -m "Rebuild data.json and exports [skip ci]"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/data.json _site/data/
          cp -r exports _site/exports

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
